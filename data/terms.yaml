# 용어집 (2주차 — 리스크 1 실측 반영).
#
# canonical = 표준형. 보정의 목표이자 출력 형태. **공식 표기를 따른다** (GitHub, Python).
# aliases   = STT가 깨뜨린 형태.
#
# `# 실측:` 주석이 붙은 별칭은 리스크 1 녹음에서 STT가 **실제로 뱉은 문자열**이다
# (원본 로그: `experiments/results/risk1.md` §5). 주석이 없는 것은 여전히 추측이다.
# 추측을 실측으로 갈아끼우는 게 이 프로젝트의 핵심 방법론이라, 둘을 구분해 둔다.
#
# 실측되지 않은 추측은 지우지 않았다. 21문장에서 안 나왔다는 건 "그렇게 안 깨진다"가
# 아니라 "이번 표본엔 없었다"일 뿐이다. 표본이 늘면 다시 판단한다.
#
# 1~20번은 `experiments/audio/녹음목록.md`의 리스크 1 실험 용어와 같다.
# 21번(의존성 주입)만 실험 목록에 없다. `translations` 필드를 쓰는 유일한 예시라
# "고정 번역어가 없으면 원문 유지"라는 기본 동작의 근거가 된다. 지우지 말 것.

version: 1
terms:
  - canonical: GitHub
    aliases: [깃허브, 깃헙, 기터벳]
    # 실측: 기터벳 — 추측 두 개는 표본에 안 나왔다.

  - canonical: repository
    aliases: [리포지토리, 레포지토리, 레파지토리, 리포지터리]
    # 실측: 리포지토리(추측 적중), 리포지터리
    # "리포지터리"는 STT 실패가 아니라 정확한 음차다. 표준형만 정답으로 세어서 놓친 것이라
    # 이건 인식이 아니라 보정이 받아야 한다.
    # "레포"는 짧아서 오탐 위험이 크다. 실측 후 판단.

  - canonical: JSON
    aliases: [제이슨, 제이손]
    # "제이슨"은 사람 이름(Jason)과 동음이다. 오탐률을 반드시 측정할 것.

  - canonical: Vue
    aliases: [브이유]
    # 실측에서 "뷰"로 나왔지만 **일부러 넣지 않았다.** 일반 명사(화면·전망)와 충돌한다.
    # 퍼지가 대신 받아줄 거라 기대할 수는 없다 — 음성 키로 재면 "뷰"와 "브이유"가 0.86이라
    # 오히려 임계값으로 막을 수 없는 쪽이다. 넣든 안 넣든 유사도로는 못 거른다.
    # → 넣는 순간 오탐을 감수하는 것이므로, 오탐 표본을 더 모아 판단한다.

  - canonical: npm install
    aliases: [엔피엠 인스톨, 엠피엠 인스톨]

  - canonical: git commit
    aliases: [깃 커밋, 짓 커밋, Git 커뮤니타]
    # 실측: Git 커뮤니타 — STT가 "git"만 영문으로 살리고 "commit"을 뭉갰다.

  - canonical: README
    aliases: [리드미, 리드미 파일, 리듬이]
    # 실측: 리듬이 — 두 문장에서 모두 이 형태로 나왔다.
    # "리드미"와 소리가 같다(연음: 리듬이 → 리드미). STT가 같은 소리를 다른 글자로 적은 것뿐이라
    # 음성 키로 재면 둘의 유사도가 1.00이다. 표기가 갈릴 뿐 발음은 우리가 이미 맞혔던 셈이다.

  - canonical: Docker
    aliases: [도커, 독커, 닷컬]
    # 실측: 도커(추측 적중), 닷컬

  - canonical: TypeScript
    aliases: [타입스크립트, 타이프스크립트, 타입스트리트, 타입 스트릿]
    # 실측: 타입스트리트, 타입 스트릿 — 한 문장에 용어가 둘 이상이면 더 심하게 깨진다.
    # 띄어쓰기까지 갈렸으므로 붙은 형태와 띈 형태를 모두 넣는다.

  - canonical: SQL
    aliases: [에스큐엘, 시퀄]

  - canonical: console.log
    aliases: [콘솔 로그, 콘솔로그, 콘솔 닷 로그]
    # 점(.)이 있어 STT가 두 단어로 쪼갤 가능성이 크다.

  - canonical: CSS
    aliases: [씨에스에스, 시에스에스]

  - canonical: REST API
    aliases: [레스트 에이피아이, 레스트 API]

  - canonical: pull request
    aliases: [풀 리퀘스트, 풀리퀘스트]
    # 실측: 풀 리퀘스트(추측 적중)

  - canonical: localhost
    aliases: [로컬호스트, 로컬 호스트]
    # 실측: 로컬 호스트(추측 적중)

  - canonical: AWS
    aliases: [에이더블유에스, 아마존 웹서비스]

  - canonical: VS Code
    aliases: [브이에스 코드, 브이에스코드, 비주얼 스튜디오 코드, vs 코드]
    # 실측: vs 코드 — 소문자로 나왔다. 대소문자를 무시할지는 탐지 쪽에서 정한다.

  - canonical: FastAPI
    aliases: [패스트에이피아이, 패스트API, 베스트 API]
    # 실측: 베스트 API — 첫 음절이 통째로 다른 단어가 됐다.

  - canonical: Python
    aliases: [파이썬, 파이선, 파일선]
    # 실측: 파일선 — hotwords를 켜고도 못 살린 셋 중 하나다.
    # 발음이 표준형과 멀어 인식 단계에서 못 잡으므로 보정이 받아야 한다.

  - canonical: React
    aliases: [리액트, 리엑트]
    # 실측: 리액트(추측 적중)

  - canonical: 의존성 주입
    aliases: [디펜던시 인젝션]
    translations:
      en: dependency injection
