# 용어집 (2차 녹음 실측 반영 — 용어 51개).
#
# canonical = 표준형. 보정의 목표이자 출력 형태. **공식 표기를 따른다** (GitHub, Python).
# aliases   = STT가 깨뜨린 형태.
#
# `# 실측:` 주석이 붙은 별칭은 녹음에서 STT가 **실제로 뱉은 문자열**이다.
# 1차 출처는 `experiments/results/risk1.md` §5, 2차 출처는 항목마다 화자와 seed로 적었다.
# 주석이 없는 것은 여전히 추측이다.
# 추측을 실측으로 갈아끼우는 게 이 프로젝트의 핵심 방법론이라, 둘을 구분해 둔다.
#
# 실측되지 않은 추측은 지우지 않았다. 64문장에서 안 나왔다는 건 "그렇게 안 깨진다"가
# 아니라 "이번 표본엔 없었다"일 뿐이다. 표본이 늘면 다시 판단한다.
#
# 1~20번은 `experiments/audio/녹음목록.md`의 리스크 1 실험 용어와 같다.
# 21·22번(lodash·debounce)은 README 첫 화면과 시연 화면 골격의 대표 예시다.
# 23번(의존성 주입)은 `translations` 필드를 쓰는 유일한 예시라
# "고정 번역어가 없으면 원문 유지"라는 기본 동작의 근거가 된다. 지우지 말 것.
# 24번부터는 2차 녹음에서 온 확장분이다 — 아래 그 구간 머리말에 따로 적어 둔다.

version: 1
terms:
  - canonical: GitHub
    aliases: [깃허브, 깃헙, 기터벳, 기터브]
    # 실측: 기터벳, 기터브 — 2차에서 "기터브"가 붙었다. 첫소리가 된소리로 굳는 같은 방식이
    # 두 번 나왔다("킷랩"도 그렇다). 추측 두 개는 아직 표본에 안 나왔다.

  - canonical: repository
    aliases: [리포지토리, 레포지토리, 레파지토리, 리포지터리]
    # 실측: 리포지토리(추측 적중), 리포지터리
    # "리포지터리"는 STT 실패가 아니라 정확한 음차다. 표준형만 정답으로 세어서 놓친 것이라
    # 이건 인식이 아니라 보정이 받아야 한다.
    # "레포"는 짧아서 오탐 위험이 크다. 실측 후 판단.

  - canonical: JSON
    aliases: [제이슨, 제이손]
    # "제이슨"은 사람 이름(Jason)과 동음이다. 오탐률을 반드시 측정할 것.

  - canonical: Vue
    aliases: [브이유]
    # 실측에서 "뷰"로 나왔지만 **일부러 넣지 않았다.** 일반 명사(화면·전망)와 충돌한다.
    # 2차에서는 같은 "뷰" 발화가 "뷰어"로 받아졌다. 짧은 음차라 표본마다 다르게 흔들린다는
    # 뜻이고, 안 넣기로 한 판단을 한 번 더 받쳐 준다.
    # 퍼지가 대신 받아줄 거라 기대할 수는 없다 — 음성 키로 재면 "뷰"와 "브이유"가 0.86이라
    # 오히려 임계값으로 막을 수 없는 쪽이다. 넣든 안 넣든 유사도로는 못 거른다.
    # → 넣는 순간 오탐을 감수하는 것이므로, 오탐 표본을 더 모아 판단한다.

  - canonical: npm install
    aliases: [엔피엠 인스톨, 엠피엠 인스톨]

  - canonical: git commit
    aliases: [깃 커밋, 짓 커밋, Git 커뮤니타]
    # 실측: Git 커뮤니타 — STT가 "git"만 영문으로 살리고 "commit"을 뭉갰다.

  - canonical: README
    aliases: [리드미, 리드미 파일, 리듬이]
    # 실측: 리듬이 — 두 문장에서 모두 이 형태로 나왔다.
    # "리드미"와 소리가 같다(연음: 리듬이 → 리드미). STT가 같은 소리를 다른 글자로 적은 것뿐이라
    # 음성 키로 재면 둘의 유사도가 1.00이다. 표기가 갈릴 뿐 발음은 우리가 이미 맞혔던 셈이다.

  - canonical: Docker
    aliases: [도커, 독커, 닷컬, 토커]
    # 실측: 도커(추측 적중), 닷컬, 토커
    # "토커"는 소리로도 "도커"와 0.800까지 붙는데, 오탐 최고값도 정확히 같은 0.800이라
    # 유사도만으로는 못 가른다. 별칭으로 박아 두면 정확 탐지가 먼저 잡아 그 자리를 비운다.

  - canonical: TypeScript
    aliases: [타입스크립트, 타이프스크립트, 타입스트리트, 타입 스트릿]
    # 실측: 타입스트리트, 타입 스트릿 — 한 문장에 용어가 둘 이상이면 더 심하게 깨진다.
    # 띄어쓰기까지 갈렸으므로 붙은 형태와 띈 형태를 모두 넣는다.

  - canonical: SQL
    aliases: [에스큐엘, 시퀄]

  - canonical: console.log
    aliases: [콘솔 로그, 콘솔로그, 콘솔 닷 로그]
    # 점(.)이 있어 STT가 두 단어로 쪼갤 가능성이 크다.

  - canonical: CSS
    aliases: [씨에스에스, 시에스에스]

  - canonical: REST API
    aliases: [레스트 에이피아이, 레스트 API]

  - canonical: pull request
    aliases: [풀 리퀘스트, 풀리퀘스트]
    # 실측: 풀 리퀘스트(추측 적중)

  - canonical: localhost
    aliases: [로컬호스트, 로컬 호스트]
    # 실측: 로컬 호스트(추측 적중)

  - canonical: AWS
    aliases: [에이더블유에스, 아마존 웹서비스]

  - canonical: VS Code
    aliases: [브이에스 코드, 브이에스코드, 비주얼 스튜디오 코드, vs 코드]
    # 실측: vs 코드 — 소문자로 나왔다. 대소문자를 무시할지는 탐지 쪽에서 정한다.

  - canonical: FastAPI
    aliases: [패스트에이피아이, 패스트API, 베스트 API, 패스트 API]
    # 실측: 베스트 API, 패스트 API — 뒤엣것은 공백 하나 때문에 붙은 형태와 갈렸다.
    # 소리로도 못 구한다. 한글 덩어리만 후보로 보는 구조라 "패스트"만 남고 뒤의 "API"가
    # 떨어져 나가 점수가 깎인다(0.769로 임계값 바로 아래에서 죽는다).
    # 임계값을 내려서 풀 일이 아니라 별칭이 받을 일이다 — 아래 셋과 같은 계열이다:
    # "쿠버 네티스"·"몽고 디비"·"엘라스틱 서치".

  - canonical: Python
    aliases: [파이썬, 파이선, 파일선]
    # 실측: 파일선 — hotwords를 켜고도 못 살린 셋 중 하나다.
    # 발음이 표준형과 멀어 인식 단계에서 못 잡으므로 보정이 받아야 한다.

  - canonical: React
    aliases: [리액트, 리엑트]
    # 실측: 리액트(추측 적중)

  - canonical: lodash
    aliases: [라다시, 로대시, 로다시, 라다씨, 러데쉬, Lada C]
    # 실측: 라다씨, 러데쉬 — 2차에서 같은 문장을 두 번 읽어 받았다.
    # **"라다시"의 추측 표시를 뗀다.** 실측이 "라다씨"로 나왔고 소리 키가 같아 1.00이다.
    # 표기만 갈렸을 뿐 발음은 맞혔던 것이라, README 첫 화면의 예시는 근거를 갖췄다.
    # "러데쉬"도 소리로는 "로대시"와 0.800까지만 붙는데 오탐 최고값과 같은 값이라
    # 유사도로는 못 가른다. "토커"와 같은 이유로 별칭에 박아 둔다.
    #
    # "Lada C"는 힌트를 준 조건에서 "라다씨"가 라틴 문자로 옮겨진 형태다. 자동차
    # 이름과 겹치지만 한국어 개발 대화에서 그 뜻으로 쓰일 자리가 없다고 봤다.
    # 한글이 아니라 퍼지가 못 잡으니 여기 없으면 되돌릴 방법이 없다.

  - canonical: debounce
    aliases: [디바운스, 디바운싱]
    # "디바운스"는 STT가 깨뜨린 형태가 아니라 정확한 음차다. 그래도 보정 대상이다 —
    # 표준형이 영문이라 한글로 적힌 이상 되돌려야 한다. "리포지터리"와 같은 경우다.

  - canonical: 의존성 주입
    aliases: [디펜던시 인젝션]
    translations:
      en: dependency injection

# ─────────────────────────────────────────────────────────────────────────────
# 2차 녹음(용어 확장) 반영 — 24~50번.
#
# `experiments/audio/manifest_용어확장.yaml`의 27개 용어를 넣는다. 그 표는 복원율을
# 재는 표가 아니라 **별칭 재료를 받는 표**였다. 27건 모두 용어집에 없어서 못 잡는 게
# 정상이었고, 못 잡은 형태가 결과다. 그 형태를 여기 옮겨 적는 것으로 표의 목적이 끝난다.
#
# 실측 출처는 세 화자 모두 large-v3 / float16 / CUDA다.
#
# 처음에는 화자 B·C(seed_46~63)를 정밀도 낮춰(int8/CPU) 돌린 전사에서 꺼냈다가,
# 나중에 같은 음성의 float16 전사를 받아 하나씩 대조했다. **18건 중 17건이 같은
# 문자열이었다.** 갈린 건 "미들베어"(C/seed_63) 하나로, int8 쪽만 띄어썼다.
# 둘 다 남겼다 — GPU가 없는 환경에서는 int8 쪽 형태가 실제로 나온다.
#
# 정밀도를 낮췄을 때만 나왔던 "Swag"(Swagger)는 넣지 않았다. float16에서는
# 온전히 살아남아, 잘린 게 음성이 아니라 정밀도 탓이었음이 드러났다.
#
# 별칭에 "힌트 준 조건"이라고 적힌 것은 전사할 때 표준형을 hotwords로 넘긴 쪽이다.
# 파이프라인이 용어집으로 hotwords를 만들어 넘기므로 이쪽이 실사용에 가깝다.
# 힌트를 줘도 안 지켜진 형태가 남는데, 그게 이 용어집이 있어야 하는 이유다.
#
# ── 일상어와 겹치는 형태를 어떻게 했는가 ──────────────────────────────────
#
# 확장하면서 처음으로 이게 실제 문제가 됐다. 재보고 셋으로 갈랐다.
#
# ① **표준 음차라서 넣었다 — 겹치는 걸 알면서 넣었다.**
#    "스프링"·"자바"·"장고"·"카프카"·"익스프레스"·"포스트맨"이 그렇다. 지어낸 문장으로
#    재보니 여섯 다 걸린다 — "스프링 노트"→"Spring 노트", "장고 영화"→"Django 영화",
#    "자바 커피"→"Java 커피". 그런데도 넣는 건 이 입력이 개발 대화라서다. 그 안에서는
#    다른 뜻이 거의 안 나오고, 빼면 이 여섯 용어를 아예 못 되돌린다.
#    **이건 안전해서 넣은 게 아니라 비용을 알고 고른 것이다.** 도메인 가정이 깨지면
#    별칭을 지울 게 아니라 문맥을 보는 수밖에 없다.
#
# ② **개발 대화 안에서도 다른 뜻이 살아 있으면 뺐다.**
#    "뷰"(Vue)가 그렇다. 화면·조회를 뜻하는 자리가 개발 대화에 그대로 있어서 ①의
#    근거가 안 선다. "코틀린"도 여기로 왔다 — 실측 문장의 "커리는"(쿼리는)과 0.833이다.
#
# ③ **오인식 형태는 그 문자열이 낱말이 아니면 넣었다.**
#    "킷랩"·"엔진X"·"D장고"·"next.jpg"·"미들 베어"가 그렇다. 되돌릴 근거는 표본
#    하나뿐이지만 잃을 일상 문장이 없다.
#
# ⚠️ **별칭에서 빼는 것이 오탐을 막아 주지는 않는다.** 확장하고 나서야 실측으로 알았다.
#    "플라스틱"은 안 넣었는데 "플라스크"를 타고 0.833으로 잡히고, "파일럿"은 안 넣었는데
#    "코파일럿"을 타고 0.875로 잡힌다. 소리 비교는 **한글 별칭끼리** 하므로, 같은 용어의
#    다른 별칭이 남아 있으면 뺀 자리가 그대로 메워진다. 빼서 막히는 건 그 용어에 한글
#    별칭이 하나도 안 남을 때뿐이다. 뺀 항목의 주석에 어느 쪽인지 적어 뒀다.
#
# 표기는 공식 표기를 따른다: Node.js·Next.js(점 포함), webpack(소문자), IntelliJ(J 대문자).

  # --- 언어·런타임 ---

  - canonical: Node.js
    aliases: [노드제이에스, 노드 제이에스]
    # 실측(A/seed_37): "Node.js" 그대로 살아남았다 — 깨진 형태가 없어 별칭은 추측뿐이다.
    # 살아남았다고 뺄 수는 없다. 등록해 두면 번역 보호가 이 자리를 지킨다.

  - canonical: Java
    aliases: [자바]
    # 실측(A/seed_38): 자바
    # 소리 키가 4자(jaba)라 퍼지 최소 길이에 못 미친다 — 이 용어는 정확 탐지만 받는다.

  - canonical: Kotlin
    # **별칭이 하나도 없다.** 셋을 다 재보고 셋 다 못 쓴다고 판단한 것이지 빠뜨린 게 아니다.
    #
    # 실측(A/seed_39, 힌트 준 조건)은 "코틀리"였다. 낱말이 아니라 넣을 뻔했는데,
    # 넣으면 Kotlin이 한글 별칭을 갖게 되면서 "커리는"(쿼리는, C/seed_31)이
    # 0.800으로 끌려온다. 아래 "코틀린"을 뺀 것과 같은 오탐이 값만 낮춰 돌아온다.
    # 0.81부터 막히니 임계값이 거기로 올라가면 그때 한 줄 넣으면 된다.
    #
    # "코트를"은 힌트 없는 조건에서 나온 형태인데(A/seed_39), "으로"까지 먹혀서
    # 조사를 떼면 "코트"가 남고 그건 옷이다. 넣어 보니 실제로 "코트를 옷장에
    # 걸어놨어요"가 Kotlin으로 바뀌었다. 소리 키도 3자라 퍼지에도 못 쓴다.
    #
    # 표준 음차인 "코틀린"은 넣어 봤다가 뺐다. 실측 문장 하나를 망가뜨린다 —
    # "쿼리는 직접 짠 SQL로만"이 "커리는"으로 전사됐는데(C/seed_31),
    # "커리는" ~ "코틀린"이 0.833에 글자 수도 같아 임계값으로 갈라낼 방법이 없다.
    # "쿼리"는 개발 대화에서 계속 나오는 말이라 이 오탐은 한 번으로 안 끝난다.

  - canonical: Rust
    aliases: [러스트]
    # 실측(A/seed_40): 러스트

  - canonical: Kubernetes
    aliases: [쿠버네티스, 쿠버 네티스]
