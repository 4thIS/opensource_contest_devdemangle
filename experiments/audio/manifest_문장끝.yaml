#
# ⚠️ 이 파일은 파생물이다. 원본은 같은 폴더의 `녹음목록_문장끝.md`.
#    문장·용어를 고칠 땐 녹음목록을 고치고 이 파일을 다시 만든다.
#    (녹음이 끝난 뒤에는 "실제로 읽은 문장"과 이 파일이 일치해야 한다)
#
# ⚠️ 1차 `manifest.yaml`과 섞지 않는다. 그쪽은 리스크 1(hotwords) 실험 전용이고
